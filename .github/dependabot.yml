version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      # Dependabot capitalizes "Bump" (seen here with this "ci" prefix, and from the npm
      # updater with a "chore(deps-dev)" prefix in stack 5f760bd), and subject-case rejects
      # it. commitlint.config.js skips a commit only when its text matches one of the
      # Dependabot shapes listed in its header; the prefix only keeps the type conventional.
      prefix: "ci"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
