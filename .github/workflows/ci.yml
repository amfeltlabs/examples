name: ci

# Required for the merge queue: the queue builds a merge_group ref and waits for the
# required checks on it, so every required job must run on merge_group as well.
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  # release-jaffle.yml runs these same jobs on the tag before it publishes anything.
  workflow_call:
    inputs:
      ref:
        description: The ref to check out; empty checks out the triggering ref
        type: string
        default: ""
    # The two secrets the tutorial job needs, and the only ones a caller passes: the org
    # App whose token reads the agent and plugin releases.
    secrets:
      APP_ID:
        description: The id of the org App that reads the agent and plugin releases
        required: true
      APP_PRIVATE_KEY:
        description: The private key of that App
        required: true
  # Runs every job against an existing ref, such as a release tag, with the workflow and
  # the tutorial job's assertions of the branch it is dispatched on:
  #   gh workflow run ci.yml --ref main -f ref=jaffle/v1.0.0
  workflow_dispatch:
    inputs:
      ref:
        description: The ref to check out, for example jaffle/v1.0.0; empty checks out the branch
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint markdown
        run: pnpm lint

  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The step is conditional, not the job: a skipped required job can leave the merge
      # queue waiting, while a job that runs and passes always reports. The queue's own
      # merge commit is not a conventional message, and the pull request already passed.
      - name: Lint the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Regenerates the trimmed Jaffle corpus from the archived full-year run and compares it
  # with the pinned digests. jafgen is never run.
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the full-year archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download corpus/jaffle-fullyear-2026-09-24 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern jaffle-fullyear-jafgen-0.4.14.tar.gz \
            --dir "$RUNNER_TEMP"

      # This job runs one Python on purpose; the addresses job covers two minor versions.
      # The determinism test fails under CI unless the intent is declared.
      - name: Reproduce the derivation chain
        env:
          JAFFLE_REQUIRE_MINORS: "1"
        run: sh jaffle/derive/reproduce.sh "$RUNNER_TEMP/jaffle-fullyear-jafgen-0.4.14.tar.gz"

  # The release asset must rebuild to the same bytes whatever the directory, timezone, umask
  # and file mtimes, and the tag check must reject a version that is not jaffle/VERSION.
  # test-reproducible.sh needs GNU tar, which this runner has. The job then extracts the
  # built tarball and loads it, so what is checked is the asset consumers download and not
  # the repository tree: load.sql, check_load.sql, run2.sql and check_run2.sql all run from
  # the extracted copy, against the same digest-pinned PostgreSQL as the load job.
  asset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_IMAGE: docker.io/library/postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    services:
      postgres:
        image: docker.io/library/postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_USER: jaffle
          POSTGRES_PASSWORD: jaffle
          POSTGRES_DB: jaffle
        options: >-
          --health-cmd "pg_isready -U jaffle -d jaffle"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Build the asset twice and compare
        run: sh jaffle/release/test-reproducible.sh

      - name: Build the asset and verify its checksum file
        run: |
          sh jaffle/release/build-asset.sh "jaffle/v$(head -n 1 jaffle/VERSION)" "$RUNNER_TEMP/asset"
          cd "$RUNNER_TEMP/asset"
          sha256sum -c ./*.sha256

      - name: Extract the asset
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP"/asset/jaffle-v*.tar.gz -C "$RUNNER_TEMP/extracted"
          ls "$RUNNER_TEMP/extracted/jaffle"

      - name: Check that client and server share the pinned image
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker pull --quiet "$POSTGRES_IMAGE"
          server=$(docker inspect --format '{{.Image}}' "$SERVICE_ID")
          client=$(docker image inspect --format '{{.Id}}' "$POSTGRES_IMAGE")
          if [ "$server" != "$client" ]; then
            echo "::error::the postgres service runs image $server, POSTGRES_IMAGE is $client"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same sequence as the load job, every file read from the extracted asset.
      - name: Load, check, apply run 2 and check it, from the extracted asset
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: |
          asset="$RUNNER_TEMP/extracted/jaffle"
          mover=$(python3 "$asset/expected/counts.py" get reveal.customer_id)
          psql_asset() {
            docker run --rm --network "$SERVICE_NETWORK" \
              -e PGHOST=postgres -e PGUSER=jaffle -e PGPASSWORD=jaffle -e PGDATABASE=jaffle \
              -v "$asset:/jaffle:ro" \
              "$POSTGRES_IMAGE" \
              psql -X -v ON_ERROR_STOP=1 -v datadir=/jaffle/data -v mover="$mover" "$@"
          }
          psql_asset --single-transaction -f /jaffle/db/load.sql
          psql_asset -f /jaffle/db/check_load.sql
          psql_asset -f /jaffle/db/run2.sql
          psql_asset -f /jaffle/db/check_run2.sql
          echo "ok: the extracted asset loads, checks, takes run 2 and checks it"

  # The address file must be byte-identical under two Python minor versions and two hash
  # seeds. The test fails unless both versions really ran (JAFFLE_REQUIRE_MINORS).
  addresses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.12
            3.13

      - name: Test the addresses under Python 3.12 and 3.13
        env:
          JAFFLE_PYTHONS: python3.12 python3.13
          JAFFLE_REQUIRE_MINORS: "2"
        run: python3.12 -m unittest test_addresses
        working-directory: jaffle/derive

  # Loads the published corpus into a fresh PostgreSQL with jaffle/db/load.sql, then checks
  # the model with jaffle/db/check_load.sql: schemas, tables, a comment on every object, the
  # keys, and row counts counted from the files. It then compares the source with run 1's
  # expected counts in jaffle/expected/counts.yaml, applies jaffle/db/run2.sql, checks its
  # orders and stores, and compares the source with run 2's. The server is the stack's
  # bundled database (stack versions.yaml, backing.database.bundled), pinned by digest; psql
  # runs from the same image, on the service's network, so the client is the one the seeds
  # use.
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A service's image cannot read the env context, so the reference is written twice; the
    # first step fails unless the service runs exactly this one.
    env:
      POSTGRES_IMAGE: docker.io/library/postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    services:
      postgres:
        image: docker.io/library/postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_USER: jaffle
          POSTGRES_PASSWORD: jaffle
          POSTGRES_DB: jaffle
        options: >-
          --health-cmd "pg_isready -U jaffle -d jaffle"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check that client and server share the pinned image
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        # Compared by image id, not by name, so the check does not depend on how the runner
        # spells the reference it was given.
        run: |
          docker pull --quiet "$POSTGRES_IMAGE"
          server=$(docker inspect --format '{{.Image}}' "$SERVICE_ID")
          client=$(docker image inspect --format '{{.Id}}' "$POSTGRES_IMAGE")
          if [ "$server" != "$client" ]; then
            echo "::error::the postgres service runs image $server, POSTGRES_IMAGE is $client"
            exit 1
          fi
          echo "ok: service and client both run $client"

      - name: Load the corpus in one transaction
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: |
          docker run --rm --network "$SERVICE_NETWORK" \
            -e PGHOST=postgres -e PGUSER=jaffle -e PGPASSWORD=jaffle -e PGDATABASE=jaffle \
            -v "$GITHUB_WORKSPACE/jaffle:/jaffle:ro" \
            "$POSTGRES_IMAGE" \
            psql -X -v ON_ERROR_STOP=1 --single-transaction -v datadir=/jaffle/data \
              -f /jaffle/db/load.sql

      - name: Check the loaded model
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: |
          docker run --rm --network "$SERVICE_NETWORK" \
            -e PGHOST=postgres -e PGUSER=jaffle -e PGPASSWORD=jaffle -e PGDATABASE=jaffle \
            -v "$GITHUB_WORKSPACE/jaffle:/jaffle:ro" \
            "$POSTGRES_IMAGE" \
            psql -X -v ON_ERROR_STOP=1 -v datadir=/jaffle/data -f /jaffle/db/check_load.sql

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The structure of the expected results: the job block, every run, every layer, all
      # seven tables, an integer each, and the reveal. counts.py is standard library only.
      - name: Validate the expected counts
        run: python3 jaffle/expected/counts.py validate

      # The source half of counts.yaml is a fact this job can check; the warehouse layers are
      # derived, and the stack's engine-capture scenario checks them against an engine run.
      # The reveal's mover must hold the before address now and the after address once run
      # 2 is applied; its deleted customer must be present now and gone after run 2.
      - name: Compare the source with run 1's expected counts
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: |
          mover=$(python3 jaffle/expected/counts.py get reveal.customer_id)
          deleted=$(python3 jaffle/expected/counts.py get reveal.deleted.customer_id)
          python3 jaffle/expected/counts.py expect run1 > "$RUNNER_TEMP/run1.expected"
          docker run --rm --network "$SERVICE_NETWORK" \
            -e PGHOST=postgres -e PGUSER=jaffle -e PGPASSWORD=jaffle -e PGDATABASE=jaffle \
            -v "$GITHUB_WORKSPACE/jaffle:/jaffle:ro" \
            "$POSTGRES_IMAGE" \
            psql -X -v ON_ERROR_STOP=1 -v mover="$mover" -v deleted="$deleted" \
              -f /jaffle/db/source_counts.sql \
            > "$RUNNER_TEMP/run1.actual"
          diff -u "$RUNNER_TEMP/run1.expected" "$RUNNER_TEMP/run1.actual"
          echo "ok: the source matches runs.run1.source, the before address and the deleted customer"

      # run2.sql opens and commits its own transaction.
      - name: Apply run 2
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: |
          docker run --rm --network "$SERVICE_NETWORK" \
            -e PGHOST=postgres -e PGUSER=jaffle -e PGPASSWORD=jaffle -e PGDATABASE=jaffle \
            -v "$GITHUB_WORKSPACE/jaffle:/jaffle:ro" \
            "$POSTGRES_IMAGE" \
            psql -X -v ON_ERROR_STOP=1 -f /jaffle/db/run2.sql

      - name: Check run 2's orders and stores
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: |
          mover=$(python3 jaffle/expected/counts.py get reveal.customer_id)
          docker run --rm --network "$SERVICE_NETWORK" \
            -e PGHOST=postgres -e PGUSER=jaffle -e PGPASSWORD=jaffle -e PGDATABASE=jaffle \
            -v "$GITHUB_WORKSPACE/jaffle:/jaffle:ro" \
            "$POSTGRES_IMAGE" \
            psql -X -v ON_ERROR_STOP=1 -v mover="$mover" -f /jaffle/db/check_run2.sql

      - name: Compare the source with run 2's expected counts
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: |
          mover=$(python3 jaffle/expected/counts.py get reveal.customer_id)
          deleted=$(python3 jaffle/expected/counts.py get reveal.deleted.customer_id)
          python3 jaffle/expected/counts.py expect run2 > "$RUNNER_TEMP/run2.expected"
          docker run --rm --network "$SERVICE_NETWORK" \
            -e PGHOST=postgres -e PGUSER=jaffle -e PGPASSWORD=jaffle -e PGDATABASE=jaffle \
            -v "$GITHUB_WORKSPACE/jaffle:/jaffle:ro" \
            "$POSTGRES_IMAGE" \
            psql -X -v ON_ERROR_STOP=1 -v mover="$mover" -v deleted="$deleted" \
              -f /jaffle/db/source_counts.sql \
            > "$RUNNER_TEMP/run2.actual"
          diff -u "$RUNNER_TEMP/run2.expected" "$RUNNER_TEMP/run2.actual"
          echo "ok: the source matches runs.run2.source, the after address, and the deletion"

  # Runs the reader's Compose path from a fresh clone, with no settings file and no agent:
  # the source starts, db/run2.sql applies and is refused the second time, the reload
  # works, SOURCE_PORT moves the port, and the DuckDB shell reads a file only its owner
  # can read.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the reader's Compose path from a fresh clone
        run: sh jaffle/steps/ci/fresh-clone.sh

  # Validates the tutorial's ready-made project file, jaffle/project/amfelt.yaml, against
  # the project-file schema, then checks it is the project the expected counts were made
  # for: its job's layer, schema prefix and select.objects equal counts.yaml's job block,
  # and its PostgreSQL and DuckDB plugin versions equal the pins in jaffle/project/IMAGE. The
  # schema is a copy of core's; schemas/README.md names the commit it was taken from. The
  # validator and PyYAML are pinned to one release each.
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the validator
        run: python3 -m pip install --disable-pip-version-check check-jsonschema==0.38.2 pyyaml==6.0.3

      - name: Validate the project file
        run: |
          check-jsonschema --schemafile schemas/amfelt-project-json-schema-v0.0.0.json \
            jaffle/project/amfelt.yaml

      - name: Check the project against the expected counts and the image pin
        run: python3 jaffle/check_project.py

  # Runs the tutorial as a reader does: jaffle/steps/01-06 and 99, unchanged, with the
  # amfelt CLI installed on the runner and on the PATH, the source and the DuckDB shell run
  # through jaffle/compose.yaml.
  # jaffle/steps/ci/tutorial.sh asserts, from its
  # own queries, every warehouse count of both runs and the history reveal against
  # jaffle/expected/counts.yaml; that a second sync on an unchanged source changes no
  # count; that a sync while a DuckDB shell holds the warehouse fails and names the lock;
  # and that steps/99-reset.sh returns step 1 to the freshly loaded source.
  #
  # Two checkouts. From the commit that triggered the workflow, in .tutorial-ci/, come only
  # jaffle/steps/ci/tutorial.sh. Everything else comes from inputs.ref: the steps, lib.sh
  # and install-from-github.sh, compose.yaml, .env.example, project/ (amfelt.yaml, IMAGE),
  # db/ (run2.sql, source_counts.sql), data/, expected/counts.yaml with counts.py, and
  # check_project.py. So a dispatch tests a release tag's tutorial with the current
  # helpers; tags up to jaffle/v2.2.0 ran the agent in a container and fail them.
  #
  # Until the release channel exists (roadmap#763), the CLI and the plugins come from
  # private GitHub releases of amfeltlabs/agent and amfeltlabs/hub, which the workflow
  # token cannot read: a contents-read token of the org App reads them. tutorial.sh still
  # checks the internal quickstart image project/IMAGE pins, which is private as well: the
  # workflow token reads it, which needs this repository's read access to the ghcr.io
  # package.
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check out the helpers of the triggering commit
        uses: actions/checkout@v7
        with:
          path: .tutorial-ci
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Mint a read token for the agent and plugin releases
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent,hub
          permission-contents: read

      # The reader's install, until the channel exists: steps/install-from-github.sh.
      - name: Install the amfelt CLI
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          sh jaffle/steps/install-from-github.sh cli "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # GH_TOKEN reaches steps 2 and 3, which install the plugins the project declares.
      - name: Run the tutorial's steps and assert what it publishes
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: sh .tutorial-ci/jaffle/steps/ci/tutorial.sh "$GITHUB_WORKSPACE/jaffle"
